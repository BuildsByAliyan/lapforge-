[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "lapforge"
dynamic = ["version"]
description = "One command. Every detail of your laptop - check its health, clean it and speed it up."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Aliyan Saleem" }]
keywords = ["laptop", "system-info", "health", "health-check", "cleaner", "speed-up", "windows", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: English",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "psutil>=5.9",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pyyaml>=6.0"]
build = ["pyinstaller>=6.0"]

[project.urls]
Homepage = "https://github.com/BuildsByAliyan/lapforge"
Source = "https://github.com/BuildsByAliyan/lapforge"
Issues = "https://github.com/BuildsByAliyan/lapforge/issues"
Download = "https://github.com/BuildsByAliyan/lapforge/releases/latest"

# `pip install .` creates the `lapforge` command.
[project.scripts]
lapforge = "lapforge.cli:main"

[tool.setuptools.dynamic]
version = { attr = "lapforge.__version__" }

[tool.setuptools.packages.find]
include = ["lapforge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
