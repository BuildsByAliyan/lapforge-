<g transform="translate(0 0)"><rect width="232" height="270" rx="16" fill="#161b22" stroke="#30363d"/><rect x="24" y="0" width="184" height="4" rx="2" fill="#58a6ff"/><circle cx="54" cy="66" r="30" fill="#58a6ff" fill-opacity="0.12" stroke="#58a6ff" stroke-opacity="0.6"/><g transform="translate(54 66)"><g fill="none" stroke="#58a6ff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M-15 0C-9 -9 9 -9 15 0C9 9 -9 9 -15 0Z"/><circle cx="0" cy="0" r="4"/></g></g><text x="24" y="136" font-family="'Segoe UI','Inter','Helvetica Neue',Arial,'DejaVu Sans',sans-serif" font-size="19" font-weight="700" fill="#e6edf3" text-anchor="start" >Preview first</text><text x="24" y="166" font-family="'Segoe UI','Inter','Helvetica Neue',Arial,'DejaVu Sans',sans-serif" font-size="14.5" font-weight="400" fill="#8b949e" text-anchor="start" >Cleaning and tweaks show</text><text x="24" y="189" font-family="'Segoe UI','Inter','Helvetica Neue',Arial,'DejaVu Sans',sans-serif" font-size="14.5" font-weight="400" fill="#8b949e" text-anchor="start" >a preview before</text><text x="24" y="212" font-family="'Segoe UI','Inter','Helvetica Neue',Arial,'DejaVu Sans',sans-serif" font-size="14.5" font-weight="400" fill="#8b949e" text-anchor="start" >anything happens.</text></g><g transform="translate(262 0)"><rect width="232" height="270" rx="16" fill="#161b22" stroke="#30363d"/><rect x="24" y="0" width="184" height="4" rx="2" fill="#3fb950"/><circle cx="54" cy="66" r="30" fill="#3fb950" fill-opacity="0.12" stroke="#3fb950" stroke-opacity="0.6"/><g transform="translate(54 66)"><g fill="none" stroke="#3fb950" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="0" cy="0" r="13"/><polyline points="-6,0 -2,5 7,-5"/></g></g><text x="24" y="136" font-family="'Segoe UI','Inter','Helvetica Neue',Arial,'DejaVu Sans',sans-serif" font-size="19" font-weight="700" fill="#e6edf3" text-anchor="start" >You confirm</text><text x="24" y="166" font-family="'Segoe UI','Inter','Helvetica Neue',Arial,'DejaVu Sans',sans-serif" font-size="14.5" font-weight="400" fill="#8b949e" text-anchor="start" >Nothing changes without</text><text x="24" y="189" font-family="'Segoe UI','Inter','Helvetica Neue',Arial,'DejaVu Sans',sans-serif" font-size="14.5" font-weight="400" fill="#8b949e" text-anchor="start" >your yes. Startup edits</text><text x="24" y="212" font-family="'Segoe UI','Inter','Helvetica Neue',Arial,'DejaVu Sans',sans-serif" font-size="14.5" font-weight="400" fill="#8b949e" text-anchor="start" >need --apply, repair</text><text x="24" y="235" font-family="'Segoe UI','Inter','Helvetica Neue',Arial,'DejaVu Sans',sans-serif" font-size="14.5" font-weight="400" fill="#8b949e" text-anchor="start" >needs --run.</text></g><g transform="translate(524 0)"><rect width="232" height="270" rx="16" fill="#161b22" stroke="#30363d"/><rect x="24" y="0" width="184" height="4" rx="2" fill="#ffb454"/><circle cx="54" cy="66" r="30" fill="#ffb454" fill-opacity="0.12" stroke="#ffb454" stroke-opacity="0.6"/><g transform="translate(54 66)"><g fill="none" stroke="#ffb454" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M-12 -2H4A8 8 0 0 1 4 14H-4"/><polyline points="-7,-9 -12,-2 -5,3"/></g></g><text x="24" y="136" font-family="'Segoe UI','Inter','Helvetica Neue',Arial,'DejaVu Sans',sans-serif" font-size="19" font-weight="700" fill="#e6edf3" text-anchor="start" >Undo ready</text><text x="24" y="166" font-family="'Segoe UI','Inter','Helvetica Neue',Arial,'DejaVu Sans',sans-serif" font-size="14.5" font-weight="400" fill="#8b949e" text-anchor="start" >Startup changes are</text><text x="24" y="189" font-family="'Segoe UI','Inter','Helvetica Neue',Arial,'DejaVu Sans',sans-serif" font-size="14.5" font-weight="400" fill="#8b949e" text-anchor="start" >backed up first. One</text><text x="24" y="212" font-family="'Segoe UI','Inter','Helvetica Neue',Arial,'DejaVu Sans',sans-serif" font-size="14.5" font-weight="400" fill="#8b949e" text-anchor="start" >command undoes them.</text></g><g transform="translate(786 0)"><rect width="232" height="270" rx="16" fill="#161b22" stroke="#30363d"/><rect x="24" y="0" width="184" height="4" rx="2" fill="#bc8cff"/><circle cx="54" cy="66" r="30" fill="#bc8cff" fill-opacity="0.12" stroke="#bc8cff" stroke-opacity="0.6"/><g transform="translate(54 66)"><g fill="none" stroke="#bc8cff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="-10" y="-3" width="20" height="16" rx="3"/><path d="M-6 -3V-8A6 6 0 0 1 6 -8V-3"/></g></g><text x="24" y="136" font-family="'Segoe UI','Inter','Helvetica Neue',Arial,'DejaVu Sans',sans-serif" font-size="19" font-weight="700" fill="#e6edf3" text-anchor="start" >Private by default</text><text x="24" y="166" font-family="'Segoe UI','Inter','Helvetica Neue',Arial,'DejaVu Sans',sans-serif" font-size="14.5" font-weight="400" fill="#8b949e" text-anchor="start" >Serial, MAC and IP are</text><text x="24" y="189" font-family="'Segoe UI','Inter','Helvetica Neue',Arial,'DejaVu Sans',sans-serif" font-size="14.5" font-weight="400" fill="#8b949e" text-anchor="start" >hidden. WiFi passwords</text><text x="24" y="212" font-family="'Segoe UI','Inter','Helvetica Neue',Arial,'DejaVu Sans',sans-serif" font-size="14.5" font-weight="400" fill="#8b949e" text-anchor="start" >only with --reveal.</text></g><g transform="translate(1048 0)"><rect width="232" height="270" rx="16" fill="#161b22" stroke="#30363d"/><rect x="24" y="0" width="184" height="4" rx="2" fill="#f85149"/><circle cx="54" cy="66" r="30" fill="#f85149" fill-opacity="0.12" stroke="#f85149" stroke-opacity="0.6"/><g transform="translate(54 66)"><g fill="none" stroke="#f85149" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="0" cy="0" r="13"/><path d="M-9 9L9 -9"/></g></g><text x="24" y="136" font-family="'Segoe UI','Inter','Helvetica Neue',Arial,'DejaVu Sans',sans-serif" font-size="19" font-weight="700" fill="#e6edf3" text-anchor="start" >Zero telemetry</text><text x="24" y="166" font-family="'Segoe UI','Inter','Helvetica Neue',Arial,'DejaVu Sans',sans-serif" font-size="14.5" font-weight="400" fill="#8b949e" text-anchor="start" >Nothing about you or</text><text x="24" y="189" font-family="'Segoe UI','Inter','Helvetica Neue',Arial,'DejaVu Sans',sans-serif" font-size="14.5" font-weight="400" fill="#8b949e" text-anchor="start" >your PC is ever sent</text><text x="24" y="212" font-family="'Segoe UI','Inter','Helvetica Neue',Arial,'DejaVu Sans',sans-serif" font-size="14.5" font-weight="400" fill="#8b949e" text-anchor="start" >anywhere. No tracking.</text></g>
