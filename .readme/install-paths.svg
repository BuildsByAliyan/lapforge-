<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="300" viewBox="0 0 1280 300" xml:space="preserve" role="img" aria-labelledby="t d">
<title id="t">Three ways to install LapForge</title><desc id="d">.exe download, pip install, or run from source.</desc>
<defs>
<linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff7b29"/><stop offset="1" stop-color="#ffb454"/></linearGradient>
<linearGradient id="g2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff7b29"/><stop offset="1" stop-color="#58a6ff"/></linearGradient>
<linearGradient id="bar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#21262d"/><stop offset="1" stop-color="#161b22"/></linearGradient>
</defs>
<g transform="translate(0 0)"><rect width="400" height="300" rx="16" fill="#161b22" stroke="#3fb950" stroke-opacity="0.55"/><rect x="28" y="26" width="90" height="28" rx="14.0" fill="#3fb950" fill-opacity="0.14" stroke="#3fb950" stroke-opacity="0.55"/><text x="40" y="41" font-family="'Segoe UI','Inter','Helvetica Neue',Arial,'DejaVu Sans',sans-serif" font-size="12" font-weight="600" fill="#3fb950" text-anchor="start" >EASIEST</text><text x="28" y="98" font-family="'Segoe UI','Inter','Helvetica Neue',Arial,'DejaVu Sans',sans-serif" font-size="26" font-weight="700" fill="#e6edf3" text-anchor="start" >Download the .exe</text><text x="28" y="134" font-family="'Segoe UI','Inter','Helvetica Neue',Arial,'DejaVu Sans',sans-serif" font-size="16" font-weight="400" fill="#8b949e" text-anchor="start" >No Python needed. Get LapForge.exe</text><text x="28" y="158" font-family="'Segoe UI','Inter','Helvetica Neue',Arial,'DejaVu Sans',sans-serif" font-size="16" font-weight="400" fill="#8b949e" text-anchor="start" >from the Releases page and</text><text x="28" y="182" font-family="'Segoe UI','Inter','Helvetica Neue',Arial,'DejaVu Sans',sans-serif" font-size="16" font-weight="400" fill="#8b949e" text-anchor="start" >double-click it.</text><rect x="28" y="226" width="344" height="46" rx="10" fill="#0d1117" stroke="#30363d"/><text x="46" y="256" font-family="'Cascadia Mono','SF Mono',Consolas,'DejaVu Sans Mono','Liberation Mono',monospace" font-size="16" font-weight="600" fill="#3fb950" text-anchor="start" >&gt; LapForge.exe</text></g><g transform="translate(440 0)"><rect width="400" height="300" rx="16" fill="#161b22" stroke="#ff7b29" stroke-opacity="0.55"/><rect x="28" y="26" width="127" height="28" rx="14.0" fill="#ff7b29" fill-opacity="0.14" stroke="#ff7b29" stroke-opacity="0.55"/><text x="40" y="41" font-family="'Segoe UI','Inter','Helvetica Neue',Arial,'DejaVu Sans',sans-serif" font-size="12" font-weight="600" fill="#ff7b29" text-anchor="start" >RECOMMENDED</text><text x="28" y="98" font-family="'Segoe UI','Inter','Helvetica Neue',Arial,'DejaVu Sans',sans-serif" font-size="26" font-weight="700" fill="#e6edf3" text-anchor="start" >Install with pip</text><text x="28" y="134" font-family="'Segoe UI','Inter','Helvetica Neue',Arial,'DejaVu Sans',sans-serif" font-size="16" font-weight="400" fill="#8b949e" text-anchor="start" >Needs Python 3.10 or newer.</text><text x="28" y="158" font-family="'Segoe UI','Inter','Helvetica Neue',Arial,'DejaVu Sans',sans-serif" font-size="16" font-weight="400" fill="#8b949e" text-anchor="start" >Works on Windows 10 and 11.</text><text x="28" y="182" font-family="'Segoe UI','Inter','Helvetica Neue',Arial,'DejaVu Sans',sans-serif" font-size="16" font-weight="400" fill="#8b949e" text-anchor="start" >Run it inside the project folder.</text><rect x="28" y="226" width="344" height="46" rx="10" fill="#0d1117" stroke="#30363d"/><text x="46" y="256" font-family="'Cascadia Mono','SF Mono',Consolas,'DejaVu Sans Mono','Liberation Mono',monospace" font-size="16" font-weight="600" fill="#ff7b29" text-anchor="start" >&gt; python -m pip install .</text></g><g transform="translate(880 0)"><rect width="400" height="300" rx="16" fill="#161b22" stroke="#58a6ff" stroke-opacity="0.55"/><rect x="28" y="26" width="155" height="28" rx="14.0" fill="#58a6ff" fill-opacity="0.14" stroke="#58a6ff" stroke-opacity="0.55"/><text x="40" y="41" font-family="'Segoe UI','Inter','Helvetica Neue',Arial,'DejaVu Sans',sans-serif" font-size="12" font-weight="600" fill="#58a6ff" text-anchor="start" >FOR DEVELOPERS</text><text x="28" y="98" font-family="'Segoe UI','Inter','Helvetica Neue',Arial,'DejaVu Sans',sans-serif" font-size="26" font-weight="700" fill="#e6edf3" text-anchor="start" >Run from source</text><text x="28" y="134" font-family="'Segoe UI','Inter','Helvetica Neue',Arial,'DejaVu Sans',sans-serif" font-size="16" font-weight="400" fill="#8b949e" text-anchor="start" >Nothing to install except the</text><text x="28" y="158" font-family="'Segoe UI','Inter','Helvetica Neue',Arial,'DejaVu Sans',sans-serif" font-size="16" font-weight="400" fill="#8b949e" text-anchor="start" >two helper packages. Great for</text><text x="28" y="182" font-family="'Segoe UI','Inter','Helvetica Neue',Arial,'DejaVu Sans',sans-serif" font-size="16" font-weight="400" fill="#8b949e" text-anchor="start" >trying and testing.</text><rect x="28" y="226" width="344" height="46" rx="10" fill="#0d1117" stroke="#30363d"/><text x="46" y="256" font-family="'Cascadia Mono','SF Mono',Consolas,'DejaVu Sans Mono','Liberation Mono',monospace" font-size="16" font-weight="600" fill="#58a6ff" text-anchor="start" >&gt; python -m lapforge</text></g>
</svg>
