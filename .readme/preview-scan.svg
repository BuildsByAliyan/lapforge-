stroke="#58a6ff" stroke-width="1.4" fill="none"/><path d="M38.4 555H592.8" stroke="#58a6ff" stroke-width="1.4" fill="none"/><path d="M592.8 555H597.0V544" stroke="#58a6ff" stroke-width="1.4" fill="none"/><text x="46.8" y="582" font-family="'Cascadia Mono','SF Mono',Consolas,'DejaVu Sans Mono','Liberation Mono',monospace" font-size="14" font-weight="400" fill="#8b949e" style="white-space:pre" textLength="210.0" lengthAdjust="spacing">Running as: Standard user</text><text x="46.8" y="604" font-family="'Cascadia Mono','SF Mono',Consolas,'DejaVu Sans Mono','Liberation Mono',monospace" font-size="14" font-weight="400" fill="#8b949e" style="white-space:pre" textLength="596.4" lengthAdjust="spacing">Smart Scan itself only looks. Nothing is removed unless you confirm it.</text><text x="30.0" y="648" font-family="'Cascadia Mono','SF Mono',Consolas,'DejaVu Sans Mono','Liberation Mono',monospace" font-size="14" font-weight="700" fill="#ff7b29" style="white-space:pre" textLength="109.2" lengthAdjust="spacing">C:\Users\you&gt;</text><rect x="147.6" y="635" width="8" height="17" fill="#ff7b29"><animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/></rect>
