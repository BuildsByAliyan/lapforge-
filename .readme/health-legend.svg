<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="284" viewBox="0 0 1280 284" xml:space="preserve" role="img" aria-labelledby="t d">
<title id="t">How to read the results</title><desc id="d">Status symbols and the four score bands.</desc>
<defs>
<linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff7b29"/><stop offset="1" stop-color="#ffb454"/></linearGradient>
<linearGradient id="g2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff7b29"/><stop offset="1" stop-color="#58a6ff"/></linearGradient>
<linearGradient id="bar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#21262d"/><stop offset="1" stop-color="#161b22"/></linearGradient>
</defs>
<rect width="620" height="284" rx="16" fill="#161b22" stroke="#30363d"/><text x="28" y="44" font-family="'Segoe UI','Inter','Helvetica Neue',Arial,'DejaVu Sans',sans-serif" font-size="16" font-weight="800" fill="#8b949e" text-anchor="start" letter-spacing="3">STATUS SYMBOLS</text><text x="30" y="92" font-family="'DejaVu Sans','Segoe UI Symbol',sans-serif" font-size="22" font-weight="700" fill="#3fb950" text-anchor="start" >●</text><text x="66" y="92" font-family="'Segoe UI','Inter','Helvetica Neue',Arial,'DejaVu Sans',sans-serif" font-size="19" font-weight="700" fill="#3fb950" text-anchor="start" >Good</text><text x="184" y="92" font-family="'Segoe UI','Inter','Helvetica Neue',Arial,'DejaVu Sans',sans-serif" font-size="15" font-weight="400" fill="#8b949e" text-anchor="start" >Everything is fine here.</text><text x="30" y="136" font-family="'DejaVu Sans','Segoe UI Symbol',sans-serif" font-size="22" font-weight="700" fill="#d29922" text-anchor="start" >▲</text><text x="66" y="136" font-family="'Segoe UI','Inter','Helvetica Neue',Arial,'DejaVu Sans',sans-serif" font-size="19" font-weight="700" fill="#d29922" text-anchor="start" >Warning</text><text x="184" y="136" font-family="'Segoe UI','Inter','Helvetica Neue',Arial,'DejaVu Sans',sans-serif" font-size="15" font-weight="400" fill="#8b949e" text-anchor="start" >Worth fixing when you have time.</text><text x="30" y="180" font-family="'DejaVu Sans','Segoe UI Symbol',sans-serif" font-size="22" font-weight="700" fill="#f85149" text-anchor="start" >✖</text><text x="66" y="180" font-family="'Segoe UI','Inter','Helvetica Neue',Arial,'DejaVu Sans',sans-serif" font-size="19" font-weight="700" fill="#f85149" text-anchor="start" >Problem</text><text x="184" y="180" font-family="'Segoe UI','Inter','Helvetica Neue',Arial,'DejaVu Sans',sans-serif" font-size="15" font-weight="400" fill="#8b949e" text-anchor="start" >Fix this first.</text><text x="30" y="224" font-family="'DejaVu Sans','Segoe UI Symbol',sans-serif" font-size="22" font-weight="700" fill="#8b949e" text-anchor="start" >○</text><text x="66" y="224" font-family="'Segoe UI','Inter','Helvetica Neue',Arial,'DejaVu Sans',sans-serif" font-size="19" font-weight="700" fill="#8b949e" text-anchor="start" >Unknown</text><text x="184" y="224" font-family="'Segoe UI','Inter','Helvetica Neue',Arial,'DejaVu Sans',sans-serif" font-size="15" font-weight="400" fill="#8b949e" text-anchor="start" >Could not be read, often needs Administrator.</text><text x="30" y="266" font-family="'Segoe UI','Inter','Helvetica Neue',Arial,'DejaVu Sans',sans-serif" font-size="14" font-weight="400" fill="#8b949e" text-anchor="start" font-style="italic">Unknown does not lower the score.</text><g transform="translate(660 0)"><rect width="620" height="284" rx="16" fill="#161b22" stroke="#30363d"/><text x="28" y="44" font-family="'Segoe UI','Inter','Helvetica Neue',Arial,'DejaVu Sans',sans-serif" font-size="16" font-weight="800" fill="#8b949e" text-anchor="start" letter-spacing="3">SCORE BANDS</text><rect x="28" y="74" width="134" height="110" rx="12" fill="#3fb950" fill-opacity="0.12" stroke="#3fb950" stroke-opacity="0.7"/><text x="95.0" y="118" font-family="'Segoe UI','Inter','Helvetica Neue',Arial,'DejaVu Sans',sans-serif" font-size="22" font-weight="800" fill="#3fb950" text-anchor="middle" >90-100</text><text x="95.0" y="152" font-family="'Segoe UI','Inter','Helvetica Neue',Arial,'DejaVu Sans',sans-serif" font-size="17" font-weight="600" fill="#e6edf3" text-anchor="middle" >Excellent</text><rect x="170" y="74" width="134" height="110" rx="12" fill="#7ee787" fill-opacity="0.12" stroke="#7ee787" stroke-opacity="0.7"/><text x="237.0" y="118" font-family="'Segoe UI','Inter','Helvetica Neue',Arial,'DejaVu Sans',sans-serif" font-size="22" font-weight="800" fill="#7ee787" text-anchor="middle" >75-89</text><text x="237.0" y="152" font-family="'Segoe UI','Inter','Helvetica Neue',Arial,'DejaVu Sans',sans-serif" font-size="17" font-weight="600" fill="#e6edf3" text-anchor="middle" >Good</text><rect x="312" y="74" width="134" height="110" rx="12" fill="#d29922" fill-opacity="0.12" stroke="#d29922" stroke-opacity="0.7"/><text x="379.0" y="118" font-family="'Segoe UI','Inter','Helvetica Neue',Arial,'DejaVu Sans',sans-serif" font-size="22" font-weight="800" fill="#d29922" text-anchor="middle" >50-74</text><text x="379.0" y="152" font-family="'Segoe UI','Inter','Helvetica Neue',Arial,'DejaVu Sans',sans-serif" font-size="17" font-weight="600" fill="#e6edf3" text-anchor="middle" >Fair</text><rect x="454" y="74" width="134" height="110" rx="12" fill="#f85149" fill-opacity="0.12" stroke="#f85149" stroke-opacity="0.7"/><text x="521.0" y="118" font-family="'Segoe UI','Inter','Helvetica Neue',Arial,'DejaVu Sans',sans-serif" font-size="22" font-weight="800" fill="#f85149" text-anchor="middle" >0-49</text><text x="521.0" y="152" font-family="'Segoe UI','Inter','Helvetica Neue',Arial,'DejaVu Sans',sans-serif" font-size="17" font-weight="600" fill="#e6edf3" text-anchor="middle" >Poor</text><text x="28" y="222" font-family="'Segoe UI','Inter','Helvetica Neue',Arial,'DejaVu Sans',sans-serif" font-size="15" font-weight="400" fill="#8b949e" text-anchor="start" >Any red problem keeps the score below Good.</text><text x="28" y="246" font-family="'Segoe UI','Inter','Helvetica Neue',Arial,'DejaVu Sans',sans-serif" font-size="15" font-weight="400" fill="#8b949e" text-anchor="start" >Run  lapforge health  to see yours.</text></g>
</svg>
